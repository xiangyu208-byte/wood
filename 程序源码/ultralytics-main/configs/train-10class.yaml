# 10 类木材缺陷检测模型训练配置
# 虫蛀与霉变因有效标注和独立评估样本不足，暂不进入正式模型。
model: configs/yolov8s-c2fpsa-10class.yaml
data: yolo-bvn-10class.yaml
epochs: 300
batch: 16
imgsz: 896
device: auto
workers: 8
optimizer: AdamW
lr0: 0.001
lrf: 0.01
weight_decay: 0.0005
warmup_epochs: 5.0
box: 7.5
cls: 0.5
dfl: 1.5
patience: 30
pretrained: true
val: true
plots: true
save: true
save_period: -1
seed: 0
deterministic: true
cos_lr: true
close_mosaic: 15
# 颜色增强用于 stain/decay 等颜色相关缺陷。
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.3
degrees: 2.0
translate: 0.05
scale: 0.2
mosaic: 0.4
project: runs/detect
name: wood-yolov8s-c2fpsa-10class
exist_ok: false

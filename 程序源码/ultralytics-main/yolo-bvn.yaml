# 木材表面缺陷检测数据集（最终 6 类）
#
# 默认目录结构：
# datasets/wood_defect/
#   images/train  labels/train
#   images/val    labels/val
#   images/test   labels/test  # 可选
#
# 训练数据未随仓库分发。可通过 train.py --data 指向其他同结构 YAML。
path: datasets/wood_defect
train: images/train
val: images/val
test: images/test

names:
  0: dry_knot
  1: sound_knot
  2: edge_knot
  3: small_knot
  4: split
  5: wave
 

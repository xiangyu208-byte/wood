spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/wood_detect?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

file:
  # 与从 wood_detect_python/wood_detect 启动的推理服务共享程序源码/data/uploads。
  upload-path: ${UPLOAD_PATH:../../data/uploads}

python:
  predict-url: ${PYTHON_PREDICT_URL:http://127.0.0.1:8001/predict}
